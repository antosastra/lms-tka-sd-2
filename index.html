    function getDefaultState() {

        },
        riwayatSesi: [],
        sesiAktif: null,
        jawabanSesiAktif: {},
        sesiSudahDisimpan: false
      };
    }

    function getStore() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) {
          const fresh = getDefaultState();
          saveStore(fresh);
          return fresh;
        }
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.bankSoal)) throw new Error("Data rusak");
        return parsed;
      } catch (e) {
        const fallback = getDefaultState();
        saveStore(fallback);
        return fallback;
      }
    }

    function saveStore(state) {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error("Gagal simpan ke storage:", e);
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function periksaJawaban(soal, inputUser) {
      if (inputUser === undefined || inputUser === null) return { status: "KOSONG", isBenar: false };
      const raw = String(inputUser).trim();
      if (raw === "") return { status: "KOSONG", isBenar: false };

      if (soal.tipe === "PG") {
        const isBenar = (raw.toUpperCase() === soal.kunci.toUpperCase());
        return { status: isBenar ? "BENAR" : "SALAH", isBenar };
      }

      const normInput = raw.toLowerCase().replace(/\.$/, "").replace(/,/g, ".");
      const normKunci = String(soal.kunci).toLowerCase().replace(/\.$/, "").replace(/,/g, ".");

      const numInput = parseFloat(normInput);
      const numKunci = parseFloat(normKunci);

      if (!isNaN(numInput) && !isNaN(numKunci) && normInput.replace(/[a-z\s]/g, "") === String(numInput)) {
        if (Math.abs(numInput - numKunci) < 0.0001) return { status: "BENAR", isBenar: true };
      }

      if (normInput === normKunci) return { status: "BENAR", isBenar: true };

      if (Array.isArray(soal.alternatifKunci)) {
        for (const alt of soal.alternatifKunci) {
          const normAlt = String(alt).toLowerCase().trim().replace(/\.$/, "").replace(/,/g, ".");
          if (normInput === normAlt) return { status: "BENAR", isBenar: true };
        }
      }

      return { status: "SALAH", isBenar: false };
    }

      else if (hash.startsWith("#/ortu/dashboard")) app.innerHTML = viewDashboardOrtu(store);
      else if (hash.startsWith("#/asesmen")) app.innerHTML = viewEvaluasiSimulasi();
      else if (hash.startsWith("#/admin")) app.innerHTML = viewAdminKonten(store);

    function viewDashboardAnak(store) {
      const riwayat = store.riwayatSesi || [];
      let menitTotal = 0, benarTotal = 0;
      riwayat.forEach(s => {
        menitTotal += (s.estimasiMenit || 15);
        benarTotal += s.jumlahBenar;
      });
      const targetMenit = store.anak.targetMenit || 60;
      const persen = Math.min(100, Math.round((menitTotal / targetMenit) * 100));

      return `
        <div class="space-y-6">
          <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white rounded-3xl p-6 md:p-8 shadow-lg">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <span class="text-xs uppercase tracking-wider font-semibold bg-white/20 px-3 py-1 rounded-full">Persiapan Ujian 2027</span>
                <h1 class="text-2xl md:text-3xl font-extrabold mt-2">Halo, ${escapeHtml(store.anak.nama)}! 👋</h1>
                <p class="text-blue-100 text-sm mt-1">Latihan bertahap untuk membangun pemahaman konsep.</p>
              </div>
              <div class="flex items-center gap-3">
                <div class="bg-white/10 backdrop-blur border border-white/20 px-4 py-3 rounded-2xl text-center">
                  <div class="text-amber-300 font-extrabold text-lg flex items-center justify-center gap-1"><i data-lucide="check-circle" class="w-5 h-5"></i> ${riwayat.length}</div>
                  <span class="text-[11px] text-blue-100">Sesi Selesai</span>
                </div>
                <div class="bg-white/10 backdrop-blur border border-white/20 px-4 py-3 rounded-2xl text-center">
                  <div class="text-emerald-300 font-extrabold text-lg flex items-center justify-center gap-1"><i data-lucide="award" class="w-5 h-5"></i> ${benarTotal}</div>
                  <span class="text-[11px] text-blue-100">Jawaban Tepat</span>
                </div>
              </div>
            </div>
            <div class="mt-6 bg-white/10 rounded-2xl p-4 border border-white/15">
              <div class="flex justify-between text-xs mb-2 font-medium">
                <span>Target Waktu: <strong>${menitTotal} dari ${targetMenit} Menit</strong></span>
                <span>${persen}%</span>
              </div>
              <div class="w-full bg-black/20 rounded-full h-3 overflow-hidden">
                <div class="bg-amber-400 h-3 rounded-full" style="width: ${persen}%"></div>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 space-y-4">
              <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
                <div class="flex items-center justify-between">
                  <h2 class="text-base font-bold text-slate-900">Mulai Latihan Hari Ini</h2>
                  <button onclick="window.LMS.navigate('#/anak/rencana')" class="text-xs font-semibold text-blue-600 hover:underline">Rencana Lengkap</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div class="p-4 rounded-xl border border-blue-200 bg-blue-50/50 flex flex-col justify-between">
                    <div>
                      <span class="text-[10px] uppercase font-bold text-blue-700 bg-blue-100 px-2 py-0.5 rounded">Rekomendasi</span>
                      <h3 class="font-bold text-sm text-slate-900 mt-2">Sesi Seimbang</h3>
                      <p class="text-xs text-slate-500 mt-1">4 Soal • 2 Matematika & 2 B. Indonesia</p>
                    </div>
                    <button onclick="window.LMS.siapkanSesi('seimbang')" class="mt-4 w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-sm">Mulai Campuran</button>
                  </div>
                  <div class="p-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 flex flex-col justify-between">
                    <div>
                      <span class="text-[10px] uppercase font-bold text-slate-700 bg-slate-100 px-2 py-0.5 rounded">Fokus</span>
                      <h3 class="font-bold text-sm text-slate-900 mt-2">Matematika</h3>
                      <p class="text-xs text-slate-500 mt-1">4 Soal • Bilangan & Geometri</p>
                    </div>
                    <button onclick="window.LMS.siapkanSesi('matematika')" class="mt-4 w-full py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl">Mulai Matematika</button>
                  </div>
                  <div class="p-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 flex flex-col justify-between">
                    <div>
                      <span class="text-[10px] uppercase font-bold text-slate-700 bg-slate-100 px-2 py-0.5 rounded">Fokus</span>
                      <h3 class="font-bold text-sm text-slate-900 mt-2">B. Indonesia</h3>
                      <p class="text-xs text-slate-500 mt-1">4 Soal • Teks Informasi & Sastra</p>
                    </div>
                    <button onclick="window.LMS.siapkanSesi('indonesia')" class="mt-4 w-full py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl">Mulai B. Indonesia</button>
                  </div>
                </div>
              </div>

              <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
                <h2 class="text-base font-bold text-slate-900">Riwayat Latihan Terkini</h2>
                ${riwayat.length === 0 ? `
                  <div class="text-center py-6 border-2 border-dashed rounded-2xl text-xs text-slate-500">Belum ada sesi latihan yang diselesaikan. Pilih salah satu sesi di atas untuk mencoba.</div>
                ` : `
                  <div class="divide-y">
                    ${riwayat.slice(-3).reverse().map((s, i) => `
                      <div class="py-2.5 flex justify-between items-center text-xs">
                        <div>
                          <strong class="text-slate-800">Sesi #${riwayat.length - i} (${escapeHtml(s.mode)})</strong>
                          <div class="text-slate-500">${s.tanggal} • ${s.jumlahBenar} dari ${s.totalSoal} Soal Benar</div>
                        </div>
                        <div class="text-right">
                          <span class="text-base font-black text-blue-600 block">${s.skor}</span>
                          <span class="text-[10px] text-slate-400">Skor</span>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>
            </div>

            <div class="space-y-4">
              <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-2">
                <h3 class="text-sm font-bold text-indigo-700 flex items-center gap-1.5"><i data-lucide="repeat" class="w-4 h-4"></i> Spaced Repetition</h3>
                <p class="text-xs text-slate-600">Soal yang dijawab kurang tepat akan otomatis diprioritaskan untuk diulang pada sesi berikutnya.</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function viewRencanaBelajar() {
      return `

          <div class="flex items-center gap-2">
            <button onclick="window.LMS.navigate('#/anak/dashboard')" class="p-1 rounded-lg hover:bg-slate-100"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>

            <button onclick="window.LMS.navigate('#/anak/materi')" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">Buka Materi Konsep</button>

    function viewMateriPembelajaran() {
      return `
        <div class="max-w-2xl mx-auto bg-white p-6 rounded-3xl border space-y-4">
          <button onclick="window.LMS.navigate('#/anak/dashboard')" class="text-xs font-bold text-slate-600">← Kembali</button>
          <h1 class="text-xl font-extrabold">Operasi Hitung Campuran Bilangan Cacah</h1>

            <strong>Contoh:</strong> 8 kotak @ 24 buku = 192 buku. Terjual 45 = 147 buku. Dibagikan merata ke 3 kelas = 49 buku per kelas.
          </div>
          <button onclick="window.LMS.siapkanSesi('seimbang')" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">Uji Pemahaman</button>
        </div>
      `;
    }

    function viewHalamanLatihan(store) {
      if (!store.sesiAktif?.soalList?.length) {
        return `<div class="text-center py-12"><button onclick="window.LMS.navigate('#/anak/dashboard')" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Pilih Sesi di Dashboard</button></div>`;
      }
      const { soalList, indeksAktif } = store.sesiAktif;
      const soal = soalList[indeksAktif];
      const ans = store.jawabanSesiAktif[soal.id] || "";

      return `
        <div class="max-w-2xl mx-auto space-y-4">
          <div class="bg-white p-4 rounded-2xl border flex justify-between items-center text-xs">
            <span class="font-bold text-slate-700">Soal ${indeksAktif + 1} dari ${soalList.length}</span>
            <span class="px-2 py-0.5 rounded-full font-bold ${soal.isSpacedRepetition ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'}">
              ${soal.isSpacedRepetition ? 'Pengulangan Terjadwal' : 'Soal Baru'}
            </span>
          </div>

          <div class="bg-white rounded-3xl p-6 border space-y-4">
            <span class="text-xs text-slate-500 font-semibold">${soal.mapel} • ${soal.kompetensi}</span>
            ${soal.stimulus ? `<div class="p-3.5 bg-slate-50 rounded-xl text-xs text-slate-800 leading-relaxed">${soal.stimulus}</div>` : ""}
            <p class="text-sm font-bold text-slate-900">${soal.tanya}</p>

            <div class="space-y-2 pt-2">
              ${soal.tipe === "PG" ? soal.opsi.map(opt => {
                const kode = opt.trim().charAt(0);
                const isSel = (ans === kode);
                return `
                  <label onclick="window.LMS.pilihJawaban('${soal.id}', '${kode}')" class="flex items-center gap-3 p-3 rounded-xl border-2 ${isSel ? 'border-blue-600 bg-blue-50/60 font-semibold' : 'border-slate-200'} cursor-pointer text-xs">
                    <input type="radio" name="soal_rad" ${isSel ? 'checked' : ''}>
                    <span>${escapeHtml(opt)}</span>
                  </label>
                `;
              }).join('') : `
                <input type="text" value="${escapeHtml(ans)}" oninput="window.LMS.simpanIsian('${soal.id}', this.value)" placeholder="Ketik jawaban Anda..." class="w-full px-3 py-2 border rounded-xl text-xs">
              `}
            </div>

            <div class="flex justify-between pt-4 border-t">
              <button onclick="window.LMS.pindahSoal(${indeksAktif - 1})" ${indeksAktif === 0 ? 'disabled class="opacity-40 text-xs font-bold"' : 'class="text-xs font-bold text-slate-700"'}>Sebelumnya</button>
              ${indeksAktif < soalList.length - 1 ? `
                <button onclick="window.LMS.pindahSoal(${indeksAktif + 1})" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Berikutnya</button>
              ` : `
                <button onclick="window.LMS.selesaikanSesi()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Kirim Jawaban</button>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function viewHasilSesi(store) {
      const latest = store.riwayatSesi[store.riwayatSesi.length - 1];
      if (!latest) return `<div class="text-center py-12"><button onclick="window.LMS.navigate('#/anak/dashboard')">Kembali</button></div>`;

      return `
        <div class="max-w-md mx-auto bg-white p-8 rounded-3xl border text-center space-y-4">
          <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-3 py-1 rounded-full uppercase">Sesi Selesai</span>
          <h1 class="text-5xl font-black text-blue-600">${latest.skor}</h1>
          <p class="text-xs text-slate-500">${latest.jumlahBenar} dari ${latest.totalSoal} Soal Tepat</p>
          <div class="grid grid-cols-2 gap-2 text-left text-xs pt-2">
            <div class="p-3 bg-blue-50 border rounded-xl"><strong>Soal Baru</strong>: ${latest.baruBenar}/${latest.baruTotal} Benar</div>
            <div class="p-3 bg-amber-50 border rounded-xl"><strong>Pengulangan</strong>: ${latest.ulangBenar}/${latest.ulangTotal} Benar</div>
          </div>
          <div class="flex gap-2 pt-2">
            <button onclick="window.LMS.navigate('#/anak/pembahasan')" class="flex-1 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold">Pembahasan</button>
            <button onclick="window.LMS.navigate('#/anak/dashboard')" class="flex-1 py-2.5 bg-slate-100 rounded-xl text-xs font-bold">Dashboard</button>
          </div>
        </div>
      `;
    }

        <div class="max-w-2xl mx-auto space-y-4">
          <div class="flex justify-between items-center">
            <h1 class="text-lg font-bold">Pembahasan Jawaban</h1>
            <button onclick="window.LMS.navigate('#/anak/dashboard')" class="text-xs font-bold text-blue-600">Selesai</button>
          </div>
          ${soalList.map((s, idx) => {
            const userAns = store.jawabanSesiAktif[s.id];
            const res = periksaJawaban(s, userAns);
            return `
              <div class="bg-white p-5 rounded-2xl border space-y-2 text-xs">
                <div class="flex justify-between font-bold">
                  <span>#${idx + 1} • ${s.mapel}</span>

                <div class="p-3 bg-slate-50 rounded-xl text-slate-700 space-y-1">
                  <div>Jawaban Kamu: <strong>${escapeHtml(userAns || 'Tidak diisi')}</strong> | Kunci: <strong class="text-emerald-700">${s.kunci}</strong></div>
                  <p class="text-slate-600 pt-1"><strong>Langkah Solusi:</strong> ${s.pembahasan}</p>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function viewDashboardOrtu(store) {
      return `
        <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl border space-y-3">
          <h1 class="text-lg font-bold text-purple-900">Pantauan Orang Tua: ${escapeHtml(store.anak.nama)}</h1>
          <p class="text-xs text-slate-600">Total sesi yang diselesaikan anak: <strong>${store.riwayatSesi.length} Sesi</strong></p>

    window.LMS = {
      navigate,
      pilihRole(role) {
        const s = getStore();
        s.role = role;
        saveStore(s);
        if (role === "anak") navigate("#/anak/dashboard");
        else if (role === "ortu") navigate("#/ortu/dashboard");
        else navigate("#/admin");
      },
      siapkanSesi(mode) {
        const s = getStore();
        const bank = s.bankSoal;
        const mat = bank.filter(x => x.mapel === "Matematika");
        const ind = bank.filter(x => x.mapel === "Bahasa Indonesia");

        let terpilih = [];
        if (mode === "matematika") terpilih = mat.slice(0, 4);
        else if (mode === "indonesia") terpilih = ind.slice(0, 4);
        else terpilih = [...mat.slice(0, 2), ...ind.slice(0, 2)];

        s.sesiAktif = {
          mode,
          indeksAktif: 0,
          soalList: terpilih.map(q => ({
            ...q,
            isSpacedRepetition: Boolean(s.riwayatSoal[q.id]?.isScheduledSpaced)
          }))
        };
        s.jawabanSesiAktif = {};
        s.sesiSudahDisimpan = false;
        saveStore(s);
        navigate("#/anak/latihan");
      },
      pilihJawaban(id, kode) {
        const s = getStore();
        s.jawabanSesiAktif[id] = kode;
        saveStore(s);
        renderApp();
      },
      simpanIsian(id, val) {
        const s = getStore();
        s.jawabanSesiAktif[id] = val.trim();
        saveStore(s);
      },
      pindahSoal(idx) {
        const s = getStore();
        if (s.sesiAktif && idx >= 0 && idx < s.sesiAktif.soalList.length) {
          s.sesiAktif.indeksAktif = idx;
          saveStore(s);
          renderApp();
        }
      },
      selesaikanSesi() {
        const s = getStore();
        if (!s.sesiAktif || s.sesiSudahDisimpan) return navigate("#/anak/hasil");

        let benar = 0, bTot = 0, bBen = 0, uTot = 0, uBen = 0;
        s.sesiAktif.soalList.forEach(q => {
          const res = periksaJawaban(q, s.jawabanSesiAktif[q.id]);
          if (res.isBenar) benar++;
          if (q.isSpacedRepetition) {
            uTot++;
            if (res.isBenar) uBen++;
          } else {
            bTot++;
            if (res.isBenar) bBen++;
          }

          if (!s.riwayatSoal[q.id]) s.riwayatSoal[q.id] = { totalAttempt: 0, totalCorrect: 0, isScheduledSpaced: false };
          s.riwayatSoal[q.id].totalAttempt++;
          if (res.isBenar) {
            s.riwayatSoal[q.id].totalCorrect++;
            s.riwayatSoal[q.id].isScheduledSpaced = false;
          } else {
            s.riwayatSoal[q.id].isScheduledSpaced = true;
          }
        });

        s.riwayatSesi.push({
          id: "SESI-" + Date.now(),
          tanggal: new Date().toLocaleDateString("id-ID"),
          mode: s.sesiAktif.mode,
          totalSoal: s.sesiAktif.soalList.length,
          jumlahBenar: benar,
          skor: Math.round((benar / s.sesiAktif.soalList.length) * 100),
          estimasiMenit: 15,
          baruTotal: bTot, baruBenar: bBen, ulangTotal: uTot, ulangBenar: uBen
        });
        s.sesiSudahDisimpan = true;
        saveStore(s);
        navigate("#/anak/hasil");
      },
      resetData() {
        if (confirm("Reset data demo ke awal?")) {
          localStorage.removeItem(STORE_KEY);
          location.reload();
        }
      },
      openAdminModal(soal = null) {
        const modal = document.getElementById("admin-modal");
        document.getElementById("modal-error").classList.add("hidden");
        if (soal) {
          document.getElementById("modal-title").textContent = "Edit Soal (" + soal.id + ")";
          document.getElementById("edit-original-id").value = soal.id;
          document.getElementById("soal-id").value = soal.id;
          document.getElementById("soal-id").disabled = true;
          document.getElementById("soal-mapel").value = soal.mapel;
          document.getElementById("soal-kompetensi").value = soal.kompetensi;
          document.getElementById("soal-kesulitan").value = soal.kesulitan;
          document.getElementById("soal-tipe").value = soal.tipe;
          document.getElementById("soal-stimulus").value = soal.stimulus || "";
          document.getElementById("soal-tanya").value = soal.tanya;
          document.getElementById("soal-pembahasan").value = soal.pembahasan;
          window.LMS.toggleFormTipe(soal.tipe);
          if (soal.tipe === "PG") {
            document.getElementById("soal-opsi-a").value = soal.opsi[0] || "";
            document.getElementById("soal-opsi-b").value = soal.opsi[1] || "";
            document.getElementById("soal-opsi-c").value = soal.opsi[2] || "";
            document.getElementById("soal-opsi-d").value = soal.opsi[3] || "";
            document.getElementById("soal-kunci-pg").value = soal.kunci;
          } else {
            document.getElementById("soal-kunci-isian").value = soal.kunci;
            document.getElementById("soal-alt-isian").value = (soal.alternatifKunci || []).join(", ");
          }
        } else {
          document.getElementById("modal-title").textContent = "Tambah Soal Draf";
          document.getElementById("edit-original-id").value = "";
          document.getElementById("soal-id").value = "";
          document.getElementById("soal-id").disabled = false;
          document.getElementById("form-soal").reset();
          window.LMS.toggleFormTipe("PG");
        }
        modal.classList.remove("hidden");
        if (window.lucide) lucide.createIcons();
      },
      closeAdminModal() {
        document.getElementById("admin-modal").classList.add("hidden");
      },
      toggleFormTipe(t) {
        if (t === "PG") {
          document.getElementById("pg-fields").classList.remove("hidden");
          document.getElementById("isian-fields").classList.add("hidden");
        } else {
          document.getElementById("pg-fields").classList.add("hidden");
          document.getElementById("isian-fields").classList.remove("hidden");
        }
      },
      handleSaveSoal(e) {
        e.preventDefault();
        const s = getStore();
        const origId = document.getElementById("edit-original-id").value;
        const id = document.getElementById("soal-id").value.trim().toUpperCase();
        const tipe = document.getElementById("soal-tipe").value;

        if (!origId && s.bankSoal.some(x => x.id === id)) {
          alert("ID sudah digunakan!");
          return;
        }

        let opsi = [], kunci = "", alt = [];
        if (tipe === "PG") {
          opsi = [
            document.getElementById("soal-opsi-a").value.trim(),
            document.getElementById("soal-opsi-b").value.trim(),
            document.getElementById("soal-opsi-c").value.trim(),
            document.getElementById("soal-opsi-d").value.trim()
          ];
          kunci = document.getElementById("soal-kunci-pg").value;
        } else {
          kunci = document.getElementById("soal-kunci-isian").value.trim();
          alt = document.getElementById("soal-alt-isian").value.split(",").map(x => x.trim()).filter(Boolean);
        }

        const item = {
          id,
          mapel: document.getElementById("soal-mapel").value,
          kompetensi: document.getElementById("soal-kompetensi").value.trim(),
          kesulitan: document.getElementById("soal-kesulitan").value,
          tipe,
          stimulus: document.getElementById("soal-stimulus").value.trim(),
          tanya: document.getElementById("soal-tanya").value.trim(),
          opsi, kunci, alternatifKunci: alt,
          pembahasan: document.getElementById("soal-pembahasan").value.trim(),
          statusVerifikasi: "Draf AI — Perlu Verifikasi Manusia"
        };

        if (origId) {
          const idx = s.bankSoal.findIndex(x => x.id === origId);
          if (idx !== -1) s.bankSoal[idx] = item;
        } else {
          s.bankSoal.push(item);
        }

        saveStore(s);
        window.LMS.closeAdminModal();
        renderApp();
      },
      editSoal(id) {
        const s = getStore();
        const item = s.bankSoal.find(x => x.id === id);
        if (item) window.LMS.openAdminModal(item);
      },
      hapusSoal(id) {
        if (confirm("Hapus soal ini?")) {
          const s = getStore();
          s.bankSoal = s.bankSoal.filter(x => x.id !== id);
          saveStore(s);
          renderApp();
        }
      }
    };

    window.addEventListener("hashchange", renderApp);
    window.addEventListener("DOMContentLoaded", () => {
      if (!window.location.hash) window.location.hash = "#/anak/dashboard";
      renderApp();
    });
  </script>
</body>
</html>
